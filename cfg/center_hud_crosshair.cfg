//=================================================================
// VISIBILITY
//=================================================================
alias "hud_xhair_visibility_clear"		"sixense_clear_bindings; sixense_write_bindings center-hud/cenhud_xhair_visibility.txt"
alias "hud_xhair_visibility_log"		"con_logfile cfg/center-hud/cenhud_xhair_visibility.txt"
//-----------------------------------------------------------------
alias "hud_xhair_on"					"hud_xhair_visibility_clear; hud_xhair_visibility_log; echo x{CustomCrosshair{visible 1}}; console_unlog"
alias "hud_xhair_off"					"hud_xhair_visibility_clear; hud_xhair_visibility_log; echo x{CustomCrosshair{visible 0}}; console_unlog"

