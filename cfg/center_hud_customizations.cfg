//=================================================================
// CUSTOMIZATION MENU
//=================================================================

alias "hud_custom_menu_clear"	"sixense_clear_bindings; sixense_write_bindings center-hud/cenhud_customization_menu.txt"
alias "hud_custom_menu_log"		"con_logfile cfg/center-hud/cenhud_customization_menu.txt"

alias "hud_custom_home"			"hud_custom_menu_clear; hud_custom_menu_log; echo X{MainMenuOverride { SafeMode { CustomizationPanel { CustomizationPanelHome {visible 1}}}}}; console_unlog"
alias "hud_custom_quick"		"hud_custom_menu_clear; hud_custom_menu_log; echo X{MainMenuOverride { SafeMode { CustomizationPanel { CustomizationPanelHome {visible 0} CustomizationPanelQuick {visible 1}}}}}; console_unlog"
alias "hud_custom_general"		"hud_custom_menu_clear; hud_custom_menu_log; echo X{MainMenuOverride { SafeMode { CustomizationPanel { CustomizationPanelHome {visible 0} CustomizationPanelGeneral {visible 1}}}}}; console_unlog"
alias "hud_custom_style"		"hud_custom_menu_clear; hud_custom_menu_log; echo X{MainMenuOverride { SafeMode { CustomizationPanel { CustomizationPanelHome {visible 0} CustomizationPanelStyle {visible 1}}}}}; console_unlog"
alias "hud_custom_fonts"		"hud_custom_menu_clear; hud_custom_menu_log; echo X{MainMenuOverride { SafeMode { CustomizationPanel { CustomizationPanelHome {visible 0} CustomizationPanelFonts {visible 1}}}}}; console_unlog"

alias "hud_custom_crosshairs"	"hud_custom_menu_clear; hud_custom_menu_log; echo X{MainMenuOverride { SafeMode { CustomizationPanel { CustomizationPanelHome {visible 0} CustomizationPanelCrosshairs {visible 1}}}}}; console_unlog"

