alias "cenhud_customization_menu_clear"			"sixense_clear_bindings; sixense_write_bindings center-hud/cenhud_customization_menu.txt"
alias "cenhud_customization_menu_log"			"con_logfile cfg/center-hud/cenhud_customization_menu.txt"

alias "cenhud_custom_home"						"cenhud_customization_menu_clear; cenhud_customization_menu_log; echo X{MainMenuOverride { SafeMode { Customizations_Panel { HUD_Customization_Home_Panel {Visible 1}}}}}; console_unlog"
alias "cenhud_custom_settings"					"cenhud_customization_menu_clear; cenhud_customization_menu_log; echo X{MainMenuOverride { SafeMode { Customizations_Panel { HUD_Customization_Home_Panel {Visible 0} HUD_Quick_Settings_Selection {Visible 1}}}}}; console_unlog"

