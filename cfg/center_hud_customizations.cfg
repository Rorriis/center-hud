//=================================================================
// TRANSPARENT VIEWMODELS
//=================================================================
alias "hud_clear_viewmodels_clear"			"sixense_clear_bindings; sixense_write_bindings center-hud/cenhud_transparent_viewmodels.txt; sixense_write_bindings center-hud/cenhud_viewmodel_setup.txt"
alias "hud_clear_viewmodels_log"			"con_logfile cfg/center-hud/cenhud_transparent_viewmodels.txt"
alias "hud_setup_viewmodels_log"			"con_logfile cfg/center-hud/cenhud_viewmodel_setup.txt"
//-----------------------------------------------------------------
alias "hud_clear_viewmodels_on"				"hud_clear_viewmodels_clear; hud_clear_viewmodels_log; echo x{TransparentViewmodel{visible 1}}; hud_setup_viewmodels_write; console_unlog"
alias "hud_clear_viewmodels_off"			"hud_clear_viewmodels_clear; hud_clear_viewmodels_log; echo x{TransparentViewmodel{visible 0}}; console_unlog"
alias "hud_setup_viewmodels_write"			"hud_setup_viewmodels_log; echo mat_motion_blur_enabled 1; echo mat_motion_blur_strength 0; echo mat_disable_bloom 1; echo mat_hdr_level 0; echo mat_colcorrection_disableentities 1; echo mat_colorcorrection 0;"

//=================================================================
// TARGET ID
//=================================================================
alias "hud_alt_spectatorhealth_clear"		"sixense_clear_bindings; sixense_write_bindings center-hud/cenhud_specguihealth.txt"
alias "hud_alt_spectatorhealth_log"			"con_logfile cfg/center-hud/cenhud_specguihealth.txt"
//-----------------------------------------------------------------
alias "hud_alt_spectatorhealth_on"			"hud_alt_spectatorhealth_clear; hud_alt_spectatorhealth_log; echo #base ../../custom/center-hud/_extras/resource/ui/spectatorguihealth.res; console_unlog"
alias "hud_alt_spectatorhealth_off"			"hud_alt_spectatorhealth_clear"
//-----------------------------------------------------------------
alias "hud_alt_targetid_clear"				"sixense_clear_bindings; sixense_write_bindings center-hud/cenhud_targetid.txt"
alias "hud_alt_targetid_log"				"con_logfile cfg/center-hud/cenhud_targetid.txt"
//-----------------------------------------------------------------
alias "hud_alt_targetid_on"					"hud_alt_targetid_clear; hud_alt_targetid_log; echo x{SpectatorGUIHealth{xpos_minmode 5}}; console_unlog"
alias "hud_alt_targetid_off"				"hud_alt_targetid_clear"
//-----------------------------------------------------------------
alias "hud_targetid_clear"					"hud_alt_targetid_clear; hud_alt_spectatorhealth_clear"
alias "hud_targetid_on"						"hud_alt_targetid_on; hud_alt_spectatorhealth_on"
alias "hud_targetid_off"					"hud_alt_targetid_off; hud_alt_spectatorhealth_off"

