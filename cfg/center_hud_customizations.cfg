alias "console_unlog"		"con_logfile console.log"

//-----------------------
//	Customization Menu
//-----------------------
alias "cenhud_customization_menu_clear"	"sixense_clear_bindings; sixense_write_bindings center-hud/cenhud_customization_menu.txt"
alias "cenhud_customization_menu_log"	"con_logfile cfg/center-hud/cenhud_customization_menu.txt"

alias "cenhud_custom_home"				"cenhud_customization_menu_clear; cenhud_customization_menu_log; echo X{MainMenuOverride { SafeMode { CustomizationPanel { CustomizationPanelHome {visible 1}}}}}; console_unlog"
alias "cenhud_custom_settings"			"cenhud_customization_menu_clear; cenhud_customization_menu_log; echo X{MainMenuOverride { SafeMode { CustomizationPanel { CustomizationPanelHome {visible 0} CustomizationPanelQuick {visible 1}}}}}; console_unlog"
alias "cenhud_custom_healthammo"		"cenhud_customization_menu_clear; cenhud_customization_menu_log; echo X{MainMenuOverride { SafeMode { CustomizationPanel { CustomizationPanelHome {visible 0} CustomizationPanelHealthAmmo {visible 1}}}}}; console_unlog"
alias "cenhud_custom_damage"			"cenhud_customization_menu_clear; cenhud_customization_menu_log; echo X{MainMenuOverride { SafeMode { CustomizationPanel { CustomizationPanelHome {visible 0} CustomizationPanelDamage {visible 1}}}}}; console_unlog"
alias "cenhud_custom_meters"			"cenhud_customization_menu_clear; cenhud_customization_menu_log; echo X{MainMenuOverride { SafeMode { CustomizationPanel { CustomizationPanelHome {visible 0} CustomizationPanelMeters {visible 1}}}}}; console_unlog"
alias "cenhud_custom_crosshairs"		"cenhud_customization_menu_clear; cenhud_customization_menu_log; echo X{MainMenuOverride { SafeMode { CustomizationPanel { CustomizationPanelHome {visible 0} CustomizationPanelCrosshairs {visible 1}}}}}; console_unlog"
