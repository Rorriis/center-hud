con_timestamp	"0"

//==============================================================
// Execute customizations
//==============================================================
exec center_hud_crosshair
exec center_hud_customizations

//==============================================================
// Execute first HUD launch setup
//==============================================================
alias "center_hud_firstrun" "exec center_hud_firstrun"
exec center-hud/center_hud_setup.txt
center_hud_firstrun

//==============================================================
// Execute menu music script
//==============================================================
exec center_hud_music

//==============================================================
// Execute no tutorial script
//==============================================================
exec center_hud_notutorial

//==============================================================
// Say HUD name in console
//==============================================================

echo ""
echo "-------------------------------"
echo "          Center HUD"
echo "-------------------------------"
echo ""

//==============================================================
// MISC Options
//==============================================================

alias "aa"			"vgui_cache_res_files 0; toggle mat_aaquality; hud_reloadscheme"
alias "tr"			"vgui_cache_res_files 0; vgui_drawtree_draw_selected 1; +vgui_drawtree"

alias "fix_all"		"stop; ds_record; snd_restart; hud_reloadscheme"

// Misc options that need to be set
tf_hud_target_id_alpha "190"
tf_mm_dashboard_slide_panel_step "20"
tf_dashboard_slide_time "0.15"

// Fix random stuff
refresh_options_dialog
alias dimmer_clicked ""
hud_escort_interp .01

hud_custom_home
hud_reloadscheme